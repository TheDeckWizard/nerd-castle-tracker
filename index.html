function cellVal(td){const t=(td?td.textContent:'').trim().replace(/,/g,'').replace(/−/g,'-');if(!t||t=='–')return null;const m=t.match(/^[+]?-?\$?-?\d+(\.\d+)?/);return m?parseFloat(m[0].replace(/[+$]/g,'')):t.toLowerCase()}
document.addEventListener('click',e=>{const th=e.target.closest('th');if(!th||th.closest('table[data-own],table[data-ab]'))return;const hr=th.parentElement,tb=hr.parentElement,ix=[...hr.children].indexOf(th);
  const rows=[...tb.children].filter(r=>r!==hr&&r.querySelector('td'));const vals=rows.map(r=>cellVal(r.children[ix]));const num=vals.filter(v=>typeof v=='number').length>=vals.filter(v=>v!=null).length/2;
  const dir=th.dataset.dir?(th.dataset.dir=='desc'?'asc':'desc'):(num?'desc':'asc');[...hr.children].forEach(h=>delete h.dataset.dir);th.dataset.dir=dir;
  const k=rows.map((r,i)=>[vals[i],r,i]);k.sort((a,b)=>{const x=a[0],y=b[0];if(x==null&&y==null)return a[2]-b[2];if(x==null)return 1;if(y==null)return -1;
    let c=num?((typeof x=='number'?x:-1e18)-(typeof y=='number'?y:-1e18)):String(x).localeCompare(String(y));return (dir=='asc'?c:-c)||a[2]-b[2]});k.forEach(z=>tb.appendChild(z[1]))});

const AC_COLS=[['Card',0,'t'],['Decks',1],['Games',2],['Cast rate',12],['Win% cast',13],['Win% not',14],['Impact',7],['±',8],['Price',9],['Owned',10],['Value',11]];
function acv(r,c){if(c==12)return r[2]?r[3]/r[2]:null;if(c==13)return r[3]?r[4]/r[3]:null;if(c==14)return r[2]-r[3]?r[5]/(r[2]-r[3]):null;if(c==0)return D.N[r[0]].toLowerCase();return r[c]}
function thumb(n){return `<img loading="lazy" class="th" alt="" src="https://api.scryfall.com/cards/named?format=image&version=small&exact=${encodeURIComponent(n)}" onerror="this.style.visibility='hidden'">`}
function allCardsPage(){

  const fmt=(r,c)=>{const v=acv(r,c);if(v==null)return '–';if(c==12||c==13||c==14)return pct(v);if(c==9)return usd(v);if(c==10)return v?'owned':'';if(c==7)return (v>0?'+':'')+v.toFixed(1);if(c==8)return '±'+(1.96*v).toFixed(1);if(c==11)return v.toFixed(1);return String(v)};
  let rows=acRows();const sc=ast.sort,dir=ast.dir;rows.sort((a,b)=>{const x=acv(a,sc),y=acv(b,sc);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:x>y?1:0)*dir});

  <p class="muted">Leaderboard needs 30+ games both cast and not cast. ${lbk[1]}.</p>
  <h3>Every card</h3><div class="ctl"><input id="acq" placeholder="Search cards" value="${esc(ast.q)}"><select id="acmin">${[[0,'Any casts'],[30,'Cast in 30+ games'],[100,'Cast in 100+ games'],[300,'Cast in 300+ games']].map(o=>`<option value="${o[0]}"${ast.min==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>
  <p class="muted">${rows.length.toLocaleString()} cards match. Tap a header to sort, tap a card for its full breakdown.</p>
  <div class="tw"><table data-own="1"><tr>${AC_COLS.map(c=>`<th data-c="${c[1]}"${c[1]==sc?` data-dir="${dir>0?'asc':'desc'}"`:''}>${c[0]}</th>`).join('')}</tr>${rows.slice(0,ast.n).map(r=>`<tr><td><a href="#c/${r[0]}">${esc(D.N[r[0]])}</a>${CMDR.has(D.N[r[0]])?' <span class="muted">cmdr</span>':''}</td>${AC_COLS.slice(1).map(c=>`<td class="${c[1]==7&&r[7]!=null?(r[7]>0?'pos':'neg'):''}">${fmt(r,c[1])}</td>`).join('')}</tr>`).join('')}</table></div>
  ${rows.length>ast.n?`<p><button id="acmore" class="more">Show ${Math.min(100,rows.length-ast.n)} more (${(rows.length-ast.n).toLocaleString()} left)</button></p>`:''}`}
function allCardsBind(){const q=$('#acq');if(!q)return;q.addEventListener('input',()=>{ast.q=q.value.toLowerCase();ast.n=100;const p=q.selectionStart;route(true);const n=$('#acq');n.focus();n.setSelectionRange(p,p)});

const AB_COLS=[['Card',0,'t'],['Type',1,'t'],['Abilities',2,'t'],['MV',3],['Games',4],['Impact',5],['Price',6],['Value',7]];
function abilitiesPage(){
  if(!CT){loadCT();return '<h2>Abilities</h2><p>Loading card text…</p>'}

  const fmtImp=v=>v==null?'–':((v>0?'+':'')+Number(v).toFixed(1)),fmtVal=v=>v==null?'–':Number(v).toFixed(1);

  ${rows.length>abst.n?`<p><button id="abmore" class="more">Show ${Math.min(100,rows.length-abst.n)} more (${(rows.length-abst.n).toLocaleString()} left)</button></p>`:''}`}
function abilitiesBind(){const q=$('#abq');if(!q)return;q.addEventListener('input',()=>{abst.q=q.value;abst.n=100;const p=q.selectionStart;route(true);const n=$('#abq');if(n){n.focus();n.setSelectionRange(p,p)}});
  document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{const id=ch.dataset.chip,i=abst.chips.indexOf(id);abst.chips=i>=0?abst.chips.filter(x=>x!==id):abst.chips.concat(id);abst.n=100;route(true)}));

function improvementsPage(){
  const UR=window.UR||{};
  const B=UR.baseline||{};
  const act=UR.active||[], sell=UR.planned_sell||[];
  const recs=act.flatMap(d=>(d.recommendations||[]).map(r=>Object.assign({},r,{key:d.key,title:d.title,br:d.bracket,bucket:'active'})));
  const appr=[...act,...sell].flatMap(d=>(d.needs_approval||[]).map(r=>Object.assign({},r,{key:d.key,title:d.title,br:d.bracket,bucket:d.bucket||'active'})));
  const prog=[...act,...sell].flatMap(d=>(d.in_progress||[]).map(r=>Object.assign({},r,{key:d.key,title:d.title,br:d.bracket})));
  const ready=(B.ready_active||[]).length;
  const fmtD=d=>d==null?'–':((d>0?'+':'')+(100*d).toFixed(1)+' pts');
  const fmtCI=c=>!c||c[0]==null?'–':((c[0]>0?'+':'')+(100*c[0]).toFixed(1)+' to '+(c[1]>0?'+':'')+(100*c[1]).toFixed(1));
  const row=r=>`<tr><td><a href="#d/${r.key}">${esc((K[r.key]||{}).cmdr||r.title||r.key)}</a> <span class="muted">${r.bucket=='planned_sell'?'planned':'active'} · B${r.br??'?'}</span></td><td>${esc(r.out||'–')}</td><td>${esc(r.in||'–')}${r.owned?' <span class="own">owned</span>':r.owned===false?' <span class="muted">buy</span>':''}</td><td>${r.price_usd==null?'–':'$'+Number(r.price_usd).toFixed(2)}</td><td class="${r.delta==null?'':r.delta>0?'pos':'neg'}">${fmtD(r.delta)}</td><td>${fmtCI(r.ci95)}</td><td>${r.games??'–'}</td><td>${pct(r.win_rate)}</td><td>${pct(r.baseline_win_rate)}</td><td>${esc(r.verdict||'')}</td></tr>`;
  const tbl=(rows,empty)=>rows.length?`<div class="tw"><table data-imp="1"><tr><th data-c="0">Deck</th><th data-c="1">Cut</th><th data-c="2">Add</th><th data-c="3">Price</th><th data-c="4">Win-rate delta</th><th data-c="5">95% CI</th><th data-c="6">Games</th><th data-c="7">Variant win%</th><th data-c="8">Baseline win%</th><th data-c="9">Verdict</th></tr>${rows.map(row).join('')}</table></div>`:`<p class="muted">${empty}</p>`;
  const eta=B.eta||'–';
  return `<h2>Recommended improvements</h2>
  <p class="muted">${esc(UR.note||'Upgrade tests start after a deck finishes its 1,000 counted baseline games. Active deck files are never edited automatically. Timeouts and crashes are excluded; upgrade tests stay separate from baseline.')}</p>

  <h3>My Active Decks — tested recommendations</h3>
  ${tbl(recs,'None yet. A recommendation appears here after a swap is tested and beats the baseline with a 95% confidence interval that is not clearly negative. Deck files in My Active Decks are not changed; this is a list only.')}
  <h3>Needs approval — would raise the current bracket</h3>
  ${tbl(appr,'No bracket-raising swaps are waiting on approval.')}
  ${appr.length?'<p class="muted">These were not tested or adopted. Ask if you want one tried as a higher-bracket path.</p>':''}
  <h3>Tests in progress</h3>
  ${tbl(prog,'No upgrade tests running right now.')}
  <h3>Planned Decks to Build and Sell</h3>

  ${tbl(sell.flatMap(d=>(d.recommendations||[]).map(r=>Object.assign({},r,{key:d.key,title:d.title,br:d.bracket,bucket:'planned_sell'}))),'No confirmed planned-list updates yet.')}`;
}

window.addEventListener('hashchange',()=>route());$('#upd').textContent='Updated '+(window.UPD||D.m.when);route();
